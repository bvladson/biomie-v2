# BIOMIE v2 public site (replaces the legacy PHP site on cutover).
# Installed as /etc/nginx/sites-enabled/biomie.magmoveiscorporativos.com.br by
# ops cutover; the legacy file is kept for an instant rollback (no rebuild).
server {
    server_name biomie.magmoveiscorporativos.com.br;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/biomie.magmoveiscorporativos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biomie.magmoveiscorporativos.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/biomie-v2-access.log biomie_v2_masked;
    error_log /var/log/nginx/biomie-v2-error.log;
    include /etc/nginx/snippets/biomie-v2-security-headers.conf;

    # Omie webhooks keep feeding the legacy BIomie, so a rollback finds it current.
    location ~ "^/(?:biomie/)?webhooks/omie/(?<wh_company>[a-z0-9_-]+)/(?<wh_token>[A-Za-z0-9_-]{32,128})/?$" {
        access_log /var/log/nginx/biomie-access.log biomie_masked;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/biomie/live/api/omie_webhook.php;
        fastcgi_param SCRIPT_NAME /api/omie_webhook.php;
        fastcgi_param QUERY_STRING company_slug=$wh_company&path_token=$wh_token;
        fastcgi_param BIOMIE_OPERATION_SCOPE_ENFORCED 1;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60;
    }

    # Old bookmarks of the legacy interface.
    location ^~ /biomie/ { return 302 /; }
    location ~ \.php$ { return 302 /; }

    # Jobs run inside the worker; never exposed.
    location ^~ /api/public/jobs/ { return 404; }

    include /etc/nginx/snippets/biomie-v2-api-locations.conf;

    location ^~ /_serverFn/ {
        limit_req zone=biomie_v2_app burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/snippets/biomie-v2-proxy.conf;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/snippets/biomie-v2-proxy.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/biomie-v2-security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/snippets/biomie-v2-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name biomie.magmoveiscorporativos.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
