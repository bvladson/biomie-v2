# BIOMIE v2 Supabase-compatible API under /supabase/ (installed as
# /etc/nginx/snippets/biomie-v2-api-locations.conf). Upstream: the PUBLIC
# gateway server (127.0.0.1:3140), which rejects the service key and GoTrue admin.
# Every request is logged (path only) and rate limited per client IP.

# Password/refresh-token logins, including direct calls that bypass the app.
location = /supabase/auth/v1/token {
    limit_req zone=biomie_v2_auth burst=10 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/biomie-v2-auth.log biomie_v2_masked;
    proxy_pass http://127.0.0.1:3140/auth/v1/token;
    include /etc/nginx/snippets/biomie-v2-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/biomie-v2-security-headers.conf;
}
location ^~ /supabase/auth/v1/recover {
    limit_req zone=biomie_v2_auth burst=3 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/biomie-v2-auth.log biomie_v2_masked;
    proxy_pass http://127.0.0.1:3140/auth/v1/recover;
    include /etc/nginx/snippets/biomie-v2-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/biomie-v2-security-headers.conf;
}
location ^~ /supabase/auth/v1/verify {
    limit_req zone=biomie_v2_auth burst=5 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/biomie-v2-auth.log biomie_v2_masked;
    proxy_pass http://127.0.0.1:3140/auth/v1/verify;
    include /etc/nginx/snippets/biomie-v2-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/biomie-v2-security-headers.conf;
}
location ^~ /supabase/auth/v1/otp {
    limit_req zone=biomie_v2_auth burst=3 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/biomie-v2-auth.log biomie_v2_masked;
    proxy_pass http://127.0.0.1:3140/auth/v1/otp;
    include /etc/nginx/snippets/biomie-v2-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/biomie-v2-security-headers.conf;
}
location ^~ /supabase/auth/v1/signup {
    return 403;
}
location ^~ /supabase/auth/v1/admin/ {
    access_log /var/log/nginx/biomie-v2-auth.log biomie_v2_masked;
    return 403;
}
location ^~ /supabase/ {
    limit_req zone=biomie_v2_api burst=60 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/biomie-v2-api.log biomie_v2_masked;
    proxy_pass http://127.0.0.1:3140/;
    include /etc/nginx/snippets/biomie-v2-proxy.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/biomie-v2-security-headers.conf;
}
