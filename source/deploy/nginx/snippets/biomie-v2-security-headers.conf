# BIOMIE v2 security headers (installed as /etc/nginx/snippets/biomie-v2-security-headers.conf).
# Include again in every location that declares its own add_header.
#
# CSP, first stage: compatible with the current frontend (TanStack SSR hydration
# uses inline scripts; Tailwind/Radix inject inline styles). Everything else is
# same-origin: fonts are self-hosted and the API lives under /supabase/.
# Next stage: nonces for scripts, then drop 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Same conservative HSTS as the legacy site (1 day; no includeSubDomains).
add_header Strict-Transport-Security "max-age=86400" always;
