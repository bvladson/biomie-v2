# BIOMIE v2 — http-context definitions (installed as /etc/nginx/conf.d/biomie-v2.conf).
#
# Log: path only ($uri) — never query strings (recovery/verify tokens), cookies,
# Authorization headers or referrers.
log_format biomie_v2_masked '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

# Rate limits per client IP.
#   auth: password/refresh token, recovery, OTP, verify (direct GoTrue calls too)
#   api:  REST/auth reads of the Supabase-compatible API
#   app:  TanStack server functions (includes the login server function)
limit_req_zone $binary_remote_addr zone=biomie_v2_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=biomie_v2_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=biomie_v2_app:10m rate=15r/s;
